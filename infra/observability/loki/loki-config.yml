# ─── Loki Configuration ───────────────────────────────────────────────────────
# Grafana Loki — Centralized Log Aggregation

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

# ── Ingester ─────────────────────────────────────────────────────────────────
ingester:
  wal:
    enabled: true
    dir: /loki/wal
  lifecycler:
    address: 127.0.0.1
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
  chunk_idle_period: 1h
  max_chunk_age: 1h
  chunk_target_size: 1048576   # 1MB
  chunk_retain_period: 30s

# ── Schema ───────────────────────────────────────────────────────────────────
schema_config:
  configs:
    - from: 2024-01-01
      store: boltdb-shipper
      object_store: filesystem
      schema: v12
      index:
        prefix: index_
        period: 24h

# ── Storage ──────────────────────────────────────────────────────────────────
storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
    cache_ttl: 24h
    shared_store: filesystem
  filesystem:
    directory: /loki/chunks

# ── Compactor ────────────────────────────────────────────────────────────────
compactor:
  working_directory: /loki/compactor
  shared_store: filesystem

# ── Limits ───────────────────────────────────────────────────────────────────
limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h    # ৭ দিনের বেশি পুরোনো log reject
  max_entries_limit_per_query: 5000
  ingestion_rate_mb: 16
  ingestion_burst_size_mb: 32

# ── Query Range ──────────────────────────────────────────────────────────────
query_range:
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

# ── Ruler (Alerting) ──────────────────────────────────────────────────────────
ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  ring:
    kvstore:
      store: inmemory
  enable_api: true
