http:
  routers:
    website-router:
      rule: "Host(`bdnagorik.com`)"
      service: website-service
      entryPoints:
        - web
    panel-router:
      rule: "Host(`panel.bdnagorik.com`)"
      service: panel-service
      entryPoints:
        - web
    admin-router:
      rule: "Host(`admin.bdnagorik.com`)"
      service: admin-service
      entryPoints:
        - web
    api-router:
      rule: "Host(`api.bdnagorik.com`)"
      service: api-service
      entryPoints:
        - web

  services:
    website-service:
      loadBalancer:
        servers:
          - url: "http://website:3000"
    panel-service:
      loadBalancer:
        servers:
          - url: "http://copanel:3000"
    admin-service:
      loadBalancer:
        servers:
          - url: "http://super-admin:3000"
    api-service:
      loadBalancer:
        servers:
          - url: "http://api-gateway:8080"
