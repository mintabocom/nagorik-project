networks:
  nagoman_default:
    name: nagoman_default
    driver: bridge

services:
  # ─── Traefik (Load Balancer & Reverse Proxy) ───────────────────────────
  traefik:
    image: traefik:v3.0
    container_name: nagoman_traefik
    ports:
      - "80:80" # HTTP
      - "443:443" # HTTPS (Production)
      - "8091:8080" # Traefik Dashboard → http://localhost:8091/dashboard/
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/load-balancer/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./infra/load-balancer/dynamic:/etc/traefik/dynamic:ro
      - ./databases/letsencrypt:/letsencrypt
    networks:
      - nagoman_default
    labels:
      - "traefik.enable=true"
    restart: unless-stopped

  # ─── API Gateway (entry point for mobile app) ─────────────────────────
  api-gateway:
    build: ./gateway
    expose:
      - "8080" # Traefik এর মাধ্যমে expose হবে, সরাসরি 8080 নয়
    environment:
      - GATEWAY_PORT=8080
      - JWT_SECRET=your_super_secret_key_for_nagoman
      - AUTH_SERVICE_URL=http://auth-service:8081
      - SOCIAL_SERVICE_URL=http://social-service:8082
      - ORG_SERVICE_URL=http://org-service:8083
      - REPORTS_SERVICE_URL=http://reports-service:8084
      - ELECTION_SERVICE_URL=http://election-service:8085
      - KNOWLEDGE_SERVICE_URL=http://knowledge-service:8086
      - NOTIFICATION_SERVICE_URL=http://notification-service:8087
      - REALTIME_SERVICE_URL=http://realtime-service:8081
      - GEO_SERVICE_URL=http://geo-service:8088
    networks:
      - nagoman_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`api.bdnagorik.com`)"
      - "traefik.http.routers.api-gateway.entrypoints=websecure"
      - "traefik.http.routers.api-gateway.tls=true"
      - "traefik.http.routers.api-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.routers.api-gateway.middlewares=rate-limit@file,cors-headers@file,compress@file"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=8080"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.path=/health"
      - "traefik.http.services.api-gateway.loadbalancer.healthcheck.interval=10s"
    depends_on:
      - traefik
      - auth-service
      - social-service
      - org-service
      - realtime-service

  # ─── Auth / Identity Service ──────────────────────────────────────────
  auth-service:
    build: ./services/auth-service
    expose:
      - "8081"
    environment:
      - DATABASE_URL=postgres://root@db:26257/nagorik_identity?sslmode=disable
    networks:
      - nagoman_default
    depends_on:
      - db

  # ─── Social Service ───────────────────────────────────────────────────
  social-service:
    build: ./services/social-service
    expose:
      - "8082"
    environment:
      - DATABASE_URL=postgres://root@db:26257/nagorik_social?sslmode=disable
    networks:
      - nagoman_default
    depends_on:
      - db

  # ─── Org Service ──────────────────────────────────────────────────────
  org-service:
    build: ./services/org-service
    expose:
      - "8083"
    environment:
      - DATABASE_URL=postgres://root@db:26257/nagorik_org?sslmode=disable
    networks:
      - nagoman_default
    depends_on:
      - db

  # ─── Realtime Service (Rust) ──────────────────────────────────────────
  realtime-service:
    build: ./services/realtime-service
    expose:
      - "8081"
    environment:
      - REDIS_URL=redis://cache:6379
    networks:
      - nagoman_default
    depends_on:
      - cache

  # ─── Geo Service ──────────────────────────────────────────────────────
  geo-service:
    build: ./services/geo-service
    expose:
      - "8088"
    environment:
      - DATABASE_URL=postgres://root@db:26257/nagorik_geo?sslmode=disable
      - PORT=8088
    networks:
      - nagoman_default
    depends_on:
      - db

  # ─── Knowledge Service ────────────────────────────────────────────────
  knowledge-service:
    build: ./services/knowledge-service
    expose:
      - "8086"
    environment:
      - DATABASE_URL=postgres://root@db:26257/nagorik_knowledge?sslmode=disable
      - PORT=8086
    networks:
      - nagoman_default
    depends_on:
      - db

  # ─── Main Website (Next.js) ──────────────────────────────────────────
  website:
    build:
      context: ./frontend/website
      args:
        - NEXT_PUBLIC_API_URL=http://api.bdnagorik.com
    expose:
      - "3000"
    ports:
      - "3005:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api.bdnagorik.com
    networks:
      - nagoman_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.website.rule=Host(`bdnagorik.com`)"
      - "traefik.http.routers.website.entrypoints=websecure"
      - "traefik.http.routers.website.tls=true"
      - "traefik.http.routers.website.tls.certresolver=letsencrypt"
      - "traefik.http.services.website.loadbalancer.server.port=3000"
    restart: unless-stopped

  # ─── Copanel (Committee Panel) ───────────────────────────────────────
  copanel:
    build:
      context: ./frontend/copanel
      args:
        - NEXT_PUBLIC_API_URL=http://api.bdnagorik.com
    expose:
      - "3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api.bdnagorik.com
    networks:
      - nagoman_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.committee.rule=Host(`panel.bdnagorik.com`)"
      - "traefik.http.routers.committee.entrypoints=websecure"
      - "traefik.http.routers.committee.tls=true"
      - "traefik.http.routers.committee.tls.certresolver=letsencrypt"
      - "traefik.http.services.committee.loadbalancer.server.port=3000"
    restart: unless-stopped

  # ─── Super Admin Panel ───────────────────────────────────────────────
  super-admin:
    build:
      context: ./frontend/super-admin
      args:
        - NEXT_PUBLIC_API_URL=http://api.bdnagorik.com
    expose:
      - "3000"
    ports:
      - "3006:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://api.bdnagorik.com
    networks:
      - nagoman_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.admin.rule=Host(`admin.bdnagorik.com`)"
      - "traefik.http.routers.admin.entrypoints=websecure"
      - "traefik.http.routers.admin.tls=true"
      - "traefik.http.routers.admin.tls.certresolver=letsencrypt"
      - "traefik.http.services.admin.loadbalancer.server.port=3000"
    restart: unless-stopped

  # ─── CockroachDB (Distributed SQL) ────────────────────────────────────
  db:
    image: cockroachdb/cockroach:v23.2.0
    command: start-single-node --insecure --max-offset=4s
    ports:
      - "26257:26257"
      - "8090:8080" # CockroachDB admin UI
    volumes:
      - ./databases/cockroachdb:/cockroach/cockroach-data
    networks:
      - nagoman_default

  # ─── Redis Cache + Pub/Sub ────────────────────────────────────────────
  cache:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - ./databases/redis:/data
    networks:
      - nagoman_default

  # ════════════════════════════════════════════════════════════════════════════
  # ─── OBSERVABILITY STACK ─────────────────────────────────────────────────
  # ════════════════════════════════════════════════════════════════════════════

  # ─── Prometheus (Metrics Collector) ───────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: nagoman_prometheus
    volumes:
      - ./infra/observability/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./databases/prometheus:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d' # ১৫ দিনের data রাখবে
      - '--web.enable-lifecycle' # Reload without restart
    expose:
      - "9090"
    networks:
      - nagoman_default
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.prometheus.rule=PathPrefix(`/prometheus`)"
      - "traefik.http.routers.prometheus.entrypoints=web"
      - "traefik.http.services.prometheus.loadbalancer.server.port=9090"
    restart: unless-stopped

  # ─── Grafana (Metrics & Log Dashboard) ────────────────────────────────────
  grafana:
    image: grafana/grafana:latest
    container_name: nagoman_grafana
    ports:
      - "3010:3000" # http://localhost:3010
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=nagoman@2024 # Production-এ পরিবর্তন করুন
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3010
      - GF_FEATURE_TOGGLES_ENABLE=traceqlEditor
    volumes:
      - ./infra/observability/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - ./infra/observability/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./databases/grafana:/var/lib/grafana
    networks:
      - nagoman_default
    depends_on:
      - prometheus
      - loki
      - jaeger
    restart: unless-stopped

  # ─── Loki (Log Aggregation) ───────────────────────────────────────────────
  loki:
    image: grafana/loki:latest
    container_name: nagoman_loki
    expose:
      - "3100"
    volumes:
      - ./infra/observability/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - ./databases/loki:/loki
    command: -config.file=/etc/loki/loki-config.yml
    networks:
      - nagoman_default
    restart: unless-stopped

  # ─── Promtail (Log Shipper) ───────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: nagoman_promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/observability/loki/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
    command: -config.file=/etc/promtail/config.yml
    networks:
      - nagoman_default
    depends_on:
      - loki
    restart: unless-stopped

  # ─── ScyllaDB (High-performance NoSQL for Chat) ────────────────────
  scylla:
    image: scylladb/scylla:latest
    container_name: nagoman_scylla
    restart: always
    volumes:
      - ./databases/scylladb:/var/lib/scylla
    command: --smp 1 # Development এর জন্য রিসোর্স লিমিট (১ টি কোর)
    networks:
      - nagoman_default
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster'"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Apache Kafka (Event Streaming - KRaft Mode) ───────────────────
  kafka:
    image: apache/kafka:latest
    container_name: nagoman_kafka
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9092
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
      - KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
      - KAFKA_LOG_DIRS=/tmp/kraft-combined-logs
    volumes:
      - ./databases/kafka:/var/lib/kafka/data
    networks:
      - nagoman_default

  # ─── Kafka UI (Management Dashboard) ────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: nagoman_kafka_ui
    ports:
      - "8095:8080" # http://localhost:8095
    environment:
      - KAFKA_CLUSTERS_0_NAME=nagoman-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
      - KAFKA_CLUSTERS_0_METRICS_PORT=9092
    networks:
      - nagoman_default
    depends_on:
      - kafka

  # ─── Jaeger (Distributed Tracing) ────────────────────────────────────────

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: nagoman_jaeger
    ports:
      - "16686:16686" # Jaeger UI → http://localhost:16686
      - "6831:6831/udp" # UDP port for traces
      - "6832:6832/udp"
      - "14268:14268" # HTTP collector
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
      - SPAN_STORAGE_TYPE=memory # Production-এ Elasticsearch/Cassandra ব্যবহার করুন
    networks:
      - nagoman_default
    restart: unless-stopped

# No named volumes used (using local folders under ./databases)
